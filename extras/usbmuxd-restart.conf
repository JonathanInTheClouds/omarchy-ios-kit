# /etc/systemd/system/usbmuxd.service.d/restart.conf
# usbmuxd 1.1.1 can abort (SIGABRT) around lldb debug sessions; without this,
# every later phone command fails with "Failed to connect to usbmuxd socket"
# until the cable is replugged. Restart it at once, as often as needed.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=1
